name: build-narration

on:
  workflow_dispatch:
  push:
    paths: ["story.json", "make_narration.py", "voices.json", "samples/**", ".github/workflows/**"]

jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TTS stack
        run: |
          pip install six "transformers>=4.48,<5"
          pip install "torch==2.8.*" "torchaudio==2.8.*" --index-url https://download.pytorch.org/whl/cpu
          pip install "coqui-tts==0.28.0"
          pip install edge-tts

      - name: Restore narration cache
        uses: actions/cache@v4
        with:
          path: output/narration_raw.wav
          key: narr-v3-${{ hashFiles('story.json', 'voices.json', 'samples/**', 'make_narration.py') }}

      - name: Generate narration
        run: |
          if [ -f output/narration_raw.wav ]; then echo "cached narration found"; exit 0; fi
          python make_narration.py

      - uses: actions/upload-artifact@v4
        with:
          name: narration
          path: |
            output/narration_raw.wav
            output/words.json
          if-no-files-found: warn
          retention-days: 7
